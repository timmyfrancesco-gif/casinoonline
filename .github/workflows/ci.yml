name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/casino_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/casino_e2e
    steps:
      - uses: actions/checkout@v5

      # pnpm version from the "packageManager" field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (engine)
        run: pnpm --filter @casino/engine test

      - name: Unit tests (shared)
        run: pnpm --filter @casino/shared test

      - name: Server tests (PostgreSQL)
        run: pnpm --filter @casino/server test

      - name: Web tests
        run: pnpm --filter @casino/web test

      - name: Build
        run: pnpm build

      - name: Create the e2e database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE casino_e2e'

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t casinoonline:ci .

      - name: Smoke test (/api/health with the database)
        run: |
          docker run -d --name casino --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/casino \
            -e APP_ORIGIN=http://localhost:3000 \
            -e COOKIE_SECURE=false \
            casinoonline:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"db":true'; then
              curl -fsS -o /dev/null http://localhost:3000/
              echo "OK"
              exit 0
            fi
            sleep 2
          done
          docker logs casino
          exit 1
